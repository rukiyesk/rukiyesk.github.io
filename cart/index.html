<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eğitim Sürecinde Üretken Yapay Zekâ Kullanımı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E2E6E3; --panel:#EEF1EF; --ink:#1D2A30; --ink-soft:#46545A; --line:#C3CCC8;
  --paper:#FFFFFF; --paper-ink:#1D2A30; --paper-soft:#6A767B;
  --focus:#2457C5; --error:#A3332B;
  --g1:#4B4F9E; --g1-bg:#E4E5F3; --g2:#2B7A74; --g2-bg:#DAEEEB; --g3:#94650F; --g3-bg:#F3E7D0; --g4:#5F696E; --g4-bg:#E5E8E9;
  --g5:#A23E62; --g5-bg:#F5E1E8; --g6:#5E7A1E; --g6-bg:#E7EFD6;
  --shadow:0 1px 0 rgba(29,42,48,.07), 0 8px 18px -8px rgba(29,42,48,.32);
  --ui:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --desk:#161C1B; --panel:#1F2725; --ink:#E5EAE7; --ink-soft:#A1AEAA; --line:#36423F;
    --paper:#F3F1EA; --paper-ink:#1D2A30; --paper-soft:#5E6A6F;
    --focus:#93B2FF; --error:#F08A80;
    --g1:#A3A7EE; --g1-bg:rgba(163,167,238,.13); --g2:#6CC6BD; --g2-bg:rgba(108,198,189,.12);
    --g3:#E3B25C; --g3-bg:rgba(227,178,92,.12); --g4:#AAB4B8; --g4-bg:rgba(170,180,184,.11);
    --g5:#EE9AB8; --g5-bg:rgba(238,154,184,.12); --g6:#B5D06A; --g6-bg:rgba(181,208,106,.12);
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -8px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#161C1B; --panel:#1F2725; --ink:#E5EAE7; --ink-soft:#A1AEAA; --line:#36423F;
  --paper:#F3F1EA; --paper-ink:#1D2A30; --paper-soft:#5E6A6F;
  --focus:#93B2FF; --error:#F08A80;
  --g1:#A3A7EE; --g1-bg:rgba(163,167,238,.13); --g2:#6CC6BD; --g2-bg:rgba(108,198,189,.12);
  --g3:#E3B25C; --g3-bg:rgba(227,178,92,.12); --g4:#AAB4B8; --g4-bg:rgba(170,180,184,.11);
    --g5:#EE9AB8; --g5-bg:rgba(238,154,184,.12); --g6:#B5D06A; --g6-bg:rgba(181,208,106,.12);
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -8px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--ui);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{appearance:none;border:0;border-radius:10px;padding:.7em 1.15em;font-weight:700;cursor:pointer;line-height:1.2}
.btn-primary{background:var(--ink);color:var(--desk)}
.btn-primary:hover{filter:brightness(1.15)}
.btn-quiet{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn-quiet:hover{box-shadow:inset 0 0 0 1.5px var(--ink-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.err{color:var(--error);font-size:15px;margin-top:6px}
.err:empty{display:none}

/* ---------- seçim kutuları (onam, bölüm) ---------- */
.choices{display:grid;gap:8px}
.choice{position:relative;display:block;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--desk);cursor:pointer;line-height:1.3;font-weight:700;font-size:16.5px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--paper);color:var(--paper-ink)}
.choice:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.choice.long{font-weight:400}

/* ---------- index card ---------- */
.icard{position:relative;display:flex;flex-direction:column;background:var(--paper);color:var(--paper-ink);border-radius:10px;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.icard .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px 0;font-size:15px;color:var(--paper-soft)}
.icard .txt{flex:1;display:flex;align-items:center;padding:12px 22px 26px;font-size:clamp(21px,2.2vw,25px);line-height:1.38;font-weight:700;text-wrap:pretty}
.icard.custom{box-shadow:var(--shadow),inset 0 0 0 2px var(--paper-soft)}
.icard.custom .txt{font-style:italic;font-weight:400}

/* ---------- giriş ekranı (tek ekrana sığar) ---------- */
.welcome{min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));max-width:1180px;margin:0 auto;padding:clamp(16px,4vh,40px) 24px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,.9fr);gap:clamp(24px,4vw,56px);align-items:center;align-content:center}
.welcome h1{font-size:clamp(28px,1.6vw + 1.8vh,42px);line-height:1.12;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
.welcome .lede{font-size:18px;color:var(--ink-soft);max-width:58ch;margin:0 0 14px}
.wleft{min-width:0}
.consent-box{height:clamp(200px,calc(100dvh - 360px),540px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:15.5px;line-height:1.55}
.consent-box h3{font-size:17px;margin:0 0 8px}
.consent-box h4{font-size:15.5px;margin:14px 0 4px}
.consent-box p{margin:0 0 8px}
.contact{font-size:14.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.45}
.opt-note{font-size:14px;color:var(--ink-soft);margin:-4px 0 8px}
.audio legend{font-size:16px}
.steps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.steps li{background:var(--panel);border-radius:999px;padding:5px 14px 5px 6px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.steps b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--desk);font-size:13px}
.assure{margin:0 0 12px;padding:9px 13px;border-left:3px solid var(--ink);background:var(--panel);border-radius:0 8px 8px 0;font-size:16px;max-width:62ch}
.more summary{cursor:pointer;font-size:15.5px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;width:max-content;max-width:100%}
.more[open]{position:relative}
.more .full{margin-top:10px;max-height:min(46vh,360px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5}
.more .full p{margin:0 0 10px}
.start{background:var(--panel);border-radius:14px;padding:22px;border:1px solid var(--line)}
.codebox{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:12px 16px 13px;box-shadow:var(--shadow);margin-bottom:16px}
.codebox .lbl{font-size:14.5px;color:var(--paper-soft)}
.code{font-size:36px;line-height:1.1;font-weight:700;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.codebox .say{font-size:14.5px;color:var(--paper-soft);margin-top:2px}
.welcome{align-items:start}
.field{margin:0 0 14px;padding:0;border:0}
.field > legend,.field > label{display:block;font-weight:700;margin-bottom:7px;padding:0;font-size:17px}
.start .btn-primary{width:100%;padding:.8em 1em;font-size:18px}
.resume{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--desk);font-size:15px}
@media (min-width:901px) and (max-height:760px){
  .welcome h1{font-size:30px}
  .welcome .lede{font-size:16.5px;margin-bottom:12px}
  .start{padding:16px}
  .code{font-size:30px}
  .choice{padding:8px 12px}
}

/* ---------- üst çubuk ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.who{font-size:16px;color:var(--ink-soft);margin-right:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.codechip{font-weight:700;letter-spacing:.07em;background:var(--paper);color:var(--paper-ink);padding:2px 10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.stepnow{font-size:15px;color:var(--ink-soft)}
.prog{display:flex;align-items:center;gap:10px;font-size:16px}
.bar{width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s}
.top .btn{padding:.45em .9em;font-size:15px}

/* ---------- bilgi formu ---------- */
.survey{max-width:780px;margin:0 auto;padding:26px 20px 48px}
.survey h1,.intro h1{font-size:clamp(26px,3vw,34px);line-height:1.15;margin:0 0 8px}
.survey .lede,.intro .lede{color:var(--ink-soft);margin:0 0 22px;font-size:17px}
.q{margin:0 0 14px;padding:16px 18px 18px;border:0;border-radius:12px;background:var(--panel)}
.q legend{float:left;width:100%;padding:0;margin:0 0 12px;font-weight:700;font-size:17.5px;line-height:1.35}
.q legend .n{color:var(--ink-soft);font-weight:400;margin-right:6px}
.q .hint{clear:both;font-size:14.5px;color:var(--ink-soft);margin:-6px 0 10px}
.q .choices{clear:both}
.pills{clear:both;display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative;display:inline-flex}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--desk);font-size:16px;line-height:1.25;cursor:pointer}
.pill input:checked + span{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.pill input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.qclear{display:none;margin-top:10px;font-size:14px}
.q:has(input[type=radio]:checked) .qclear{display:inline-block}
.txtin{width:100%;margin-top:12px;padding:.6em .8em;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--paper-ink);font-size:16px}
.txtin:focus{border-color:var(--ink)}
.follow{display:none;margin-top:12px}
.follow.show{display:block}
.follow label{font-size:15.5px;font-weight:700}
.follow .txtin{margin-top:6px}
.readonly{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.readonly b{font-size:17px}
.note{margin:22px 0;padding:14px 16px;border-radius:12px;border:1.5px dashed var(--line);font-size:16px;color:var(--ink-soft)}
.note h2{font-size:17px;margin:0 0 6px;color:var(--ink)}
.note p{margin:0}
.submitrow{display:flex;justify-content:flex-end}
.sync{min-height:1.2em}
.sync.error{color:var(--error)}
.loading{min-height:60vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--ink-soft)}
.loading .btn{margin-top:14px}

/* ---------- etkinlik tanıtımı ---------- */
.intro{max-width:1080px;margin:0 auto;padding:26px 20px 48px}
.ladder{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:14px;align-items:stretch;margin:0 0 24px}
.rung{border-radius:12px;background:var(--bg);border-top:5px solid var(--c);padding:14px 16px 16px}
.rung b{display:block;font-size:18px;line-height:1.28;margin-bottom:4px}
.rung span{font-size:15.5px;color:var(--ink-soft);line-height:1.42;display:block}
.intro .assure{margin-bottom:22px}

/* ---------- kart sıralama ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:22px 20px 40px}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:24px}
.howto{font-size:17px;color:var(--ink-soft);max-width:58ch;text-align:center}
.howto p{margin:0 0 4px}
.howto kbd{font-family:var(--ui);font-size:13px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--panel)}
.deck-col{width:min(100%,460px)}
.deck{position:relative;min-height:236px}
.deck .stack{position:absolute;inset:0;border-radius:10px;background:var(--paper);box-shadow:var(--shadow);opacity:.9}
.deck .stack.s1{transform:translate(6px,7px) rotate(1.4deg)}
.deck .stack.s2{transform:translate(-5px,12px) rotate(-1.6deg)}
.deck .top-card{position:relative;min-height:236px;cursor:grab;touch-action:none}
.deck .top-card:active{cursor:grabbing}
.deck .top-card.dim{opacity:.4}
.deck .del{background:none;border:0;padding:4px 6px;color:var(--paper-ink);font-size:15px;text-decoration:underline;cursor:pointer;font-family:var(--ui)}
@media (prefers-reduced-motion:no-preference){
  .deck .top-card.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes enter{from{transform:translateY(10px) rotate(-1.5deg);opacity:.2}}
}
.selnote{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--desk);font-size:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.selnote .link{color:var(--desk)}
.done-panel{min-height:236px;border:2px dashed var(--line);border-radius:10px;padding:24px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}
.done-panel .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:6px}
.done-panel h2{margin:0;font-size:22px}
.done-panel p{margin:0;color:var(--ink-soft);font-size:17px}

.trays{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:14px}
.tray{display:flex;flex-direction:column;overflow:hidden;border-radius:12px;background:var(--bg);border:2px solid transparent;min-height:260px;transition:border-color .12s,background-color .12s}
.tray.over,.tray.armed:hover{border-color:var(--c)}
.tray.over{background:color-mix(in srgb,var(--bg) 60%,var(--c) 14%)}
.tray-head{appearance:none;border:0;background:none;text-align:left;cursor:pointer;padding:16px 16px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;border-radius:10px 10px 0 0;color:var(--ink);border-top:5px solid var(--c)}
.tray-head .name{font-weight:700;font-size:18px;line-height:1.28}
.tray-head .count{font-size:26px;font-weight:700;color:var(--c);line-height:1}
.tray-head .desc{grid-column:1/-1;font-size:15.5px;line-height:1.42;color:var(--ink-soft)}
.tray-head kbd{font-family:var(--ui);font-size:13px;font-weight:400;padding:0 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-soft);margin-left:6px;vertical-align:2px}
.tray-toggle{display:none;appearance:none;border:0;background:none;margin:-4px 8px 8px;padding:8px 6px;font-size:15px;font-weight:700;color:var(--ink);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (hover:none){.tray-head kbd,.kbdhint{display:none}}
.tray-body{flex:1;padding:4px 12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.tray-empty{font-size:15px;color:var(--ink-soft);padding:8px 4px}
.mini{appearance:none;border:0;text-align:left;width:100%;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:10px 12px 11px;font-size:16px;line-height:1.42;box-shadow:0 1px 0 rgba(29,42,48,.08),0 3px 6px -3px rgba(29,42,48,.25);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.mini.custom{font-style:italic;box-shadow:inset 0 0 0 1.5px var(--paper-soft)}
.mini[aria-pressed="true"]{outline:3px solid var(--c);outline-offset:1px}
.mini.dragging-src{opacity:.3}
.mini:disabled{opacity:1;color:var(--paper-ink)}
@media (prefers-reduced-motion:no-preference){
  .mini.just{animation:land .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes land{from{transform:translateY(-14px) scale(1.04);box-shadow:0 12px 20px -8px rgba(29,42,48,.45)}}
}
.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;opacity:.95;box-shadow:0 18px 30px -10px rgba(0,0,0,.45)}
body.is-dragging,body.is-dragging *{cursor:grabbing !important}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap;color:var(--ink-soft);font-size:14px}

/* ---------- pencereler ---------- */
dialog{border:0;border-radius:14px;padding:0;background:var(--panel);color:var(--ink);max-width:min(460px,calc(100vw - 32px));width:100%;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(16,22,21,.45)}
.dlg{padding:22px}
.dlg h2{margin:0 0 6px;font-size:21px}
.dlg p{margin:0 0 16px;color:var(--ink-soft);font-size:17px}
.dlg .row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.blank{min-height:200px}
.blank textarea{display:block;width:100%;min-height:130px;border:0;background:transparent;resize:none;padding:10px 22px 20px;font-size:21px;line-height:1.4;font-style:italic;color:var(--paper-ink)}
.blank textarea:focus{outline:none}
.blank:focus-within{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- bitiş ---------- */
.done,.decline{max-width:1180px;margin:0 auto;padding:clamp(24px,4vw,48px) 20px 48px}
.done h1,.decline h1{font-size:clamp(28px,3.6vw,40px);margin:0 0 8px;line-height:1.15}
.done .lede,.decline .lede{color:var(--ink-soft);margin:0 0 26px;max-width:60ch}
.done .tray{min-height:0}
.done .tray-head{cursor:default}
.done .mini{cursor:default}

/* ---------- duyarlı düzen ---------- */
@media (max-width:1100px){ .kbdhint{display:none !important} }
@media (max-width:900px){
  .welcome{grid-template-columns:1fr;max-width:640px;gap:16px}
  .consent-box{height:clamp(170px,24vh,360px)}
  .trays{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ladder{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  body{font-size:17px}
  .welcome{padding:12px 16px;gap:12px}
  .welcome h1{font-size:25px;margin-bottom:6px}
  .welcome .lede{display:none}
  .consent-box{height:21vh;min-height:150px;padding:10px 12px;font-size:14.5px}
  .opt-note{font-size:13px}
  .contact{font-size:13.5px;margin-top:6px}
  .steps{margin-bottom:10px;gap:5px}
  .steps .dur{display:none}
  .steps li{font-size:14px;padding:3px 9px 3px 4px;gap:6px}
  .steps b{width:20px;height:20px;font-size:12px}
  .assure{font-size:14.5px;padding:7px 11px;margin-bottom:8px}
  .more summary{font-size:14.5px}
  .start{padding:0;border:0;background:none}
  .codebox{padding:10px 14px;margin-bottom:12px;display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
  .code{font-size:28px}
  .codebox .say{flex-basis:100%}
  .field{margin-bottom:10px}
  .field > legend,.field > label{font-size:15.5px;margin-bottom:5px}
  .choice{padding:8px 12px;font-size:15px;background:var(--panel)}
  .start .btn-primary{font-size:17px;padding:.7em 1em}
  .top-in{padding:8px 14px;gap:6px 12px}
  .who{font-size:14.5px;flex-basis:100%}
  .stepnow{flex-basis:100%;font-size:14px}
  .prog{margin-right:auto}
  .bar{width:72px}
  .survey,.intro{padding:18px 14px 36px}
  .q{padding:14px 14px 16px}
  .q legend{font-size:16.5px}
  .pill span{font-size:15px;padding:8px 13px}
  .submitrow .btn{width:100%}
  .ladder{grid-template-columns:1fr}

<script>
(() => {
"use strict";

/* ===== İçerik: gruplar, bölümler, bilgi formu ve kartlar veri tabanından yüklenir (admin panelinden yönetilir) ===== */
// Gruplar hiyerarşik sırada: kendim → birlikte → çoğunlukla yapay zekâ → yapmıyorum
let GROUPS = [], DEPTS = [], SURVEY = [], CARDS = [];
const CFG = window.KS_CONFIG;
const MAX_BLANK = 3;
const CONSENT_HTML = `
<h3>Aydınlatılmış Onam Formu</h3>
<p>Sayın gönüllü,</p>
<p>Ankara Üniversitesi Yazılım Mühendisliği Bölümü ve Hacettepe Üniversitesi Bilgisayar ve Öğretim Teknolojileri Eğitimi Bölümü tarafından yürütülen “Üniversite Öğrencilerinin Yapay Zekâya Yönelik Bilişsel Boşaltım (Cognitive Offloading) Davranışları ve Öz-Düzenleme Müdahalesi: Bir Pilot Uygulama” başlıklı araştırmaya katılmak üzere davet edilmiş bulunuyorsunuz. Bu çalışmaya sadece 18 yaş üzeri gönüllü bireyler katılmaktadır. Bu araştırmada yer almayı kabul etmeden önce, araştırmanın ne amaçla yapılmak istendiğini anlamanız ve kararınızı bu bilgilendirme çerçevesinde özgürce vermeniz gerekmektedir.</p>
<p>Aşağıdaki bilgileri lütfen dikkatlice okuyunuz, sorularınız olursa sorunuz ve açık yanıtlar isteyiniz.</p>
<h4>Araştırmanın Amacı ve Kapsamı</h4>
<p>Bu araştırmanın amacı, üniversite öğrencilerinin ders ve ödev süreçlerinde yapay zekâ (YZ) araçlarını (ör. ChatGPT, Gemini, Claude, Copilot) nasıl ve neden kullandıklarını; hangi işleri YZ’ye bıraktıklarını, hangilerini YZ ile birlikte ya da kendileri yaptıklarını ve bu süreçte kendi öğrenmelerini nasıl planlayıp izlediklerini öğrencilerin kendi deneyimleri üzerinden anlamaktır. YZ’yi kullanıp kullanmamanız değil, nasıl ve neden kullandığınız merak edilmektedir; soruların doğru ya da yanlış cevabı yoktur. Bu kapsamda, siz gönüllü öğrencilerden önce kısa bir Görüşme Öncesi Bilgi Formu doldurmanız (ad-soyad ve öğrenci numarası istenmez), ardından bir araştırmacıyla yüz yüze ya da çevrimiçi, yarı yapılandırılmış bireysel bir görüşme yapmanız beklenmektedir. Görüşmede YZ’yi kullandığınız somut anlar hakkında sorular sorulacaktır. Ayrıca çevrimiçi bir sürükle-bırak uygulamasında, üzerinde öğrenme ve ödev sırasında yapılan bazı işlerin yazılı olduğu kartları dört gruba ayırmanız ve bunu yaparken düşüncelerinizi sesli olarak paylaşmanız istenecektir. Bu uygulamada adınız ya da herhangi bir kimlik bilginiz istenmez; etkinliğin sonunda yalnızca kartların son dizilimini gösteren ekranın görüntüsü alınacaktır. Görüşme, izin vermeniz halinde ses kaydına alınacak, izin vermemeniz halinde araştırmacı yazılı not tutacaktır. Görüntü kaydı yapılmayacaktır; çevrimiçi görüşmelerde de yalnızca ses kaydedilecek, kamera görüntüsü kaydedilmeyecektir. Görüşmeyi, dersinizi veren ya da notunuzu belirleyen bir öğretim elemanı yapmayacak; görüşmede anlattıklarınız hiçbir derse, nota ya da disiplin sürecine yansıtılmayacaktır.</p>
<h4>Araştırmaya Katılacak Kişilerin Harcayacağı Süre</h4>
<p>Araştırma kapsamında gönüllülerden Görüşme Öncesi Bilgi Formu’nu doldurmaları ve bireysel görüşmeye katılmaları beklenmektedir. Bilgi formunun doldurulması yaklaşık 3 dakika, görüşme ise yaklaşık 45 dakika sürecektir. Görüşme, sizin için uygun bir gün ve saatte, üniversitenizde sessiz bir ofis ya da toplantı odasında yüz yüze ya da çevrimiçi olarak tek oturumda gerçekleştirilecek olup görüşme sırasında istediğiniz zaman ara verebilirsiniz.</p>
<h4>Araştırmaya Katılacak Kişiler için Gönüllülük Esası</h4>
<p>Bu araştırmaya katılmak tamamen gönüllülük esasına dayanmaktadır. Çalışmaya katılmama veya katıldıktan sonra herhangi bir anda çalışmadan çıkma hakkına sahipsiniz. Herhangi bir soruyu yanıtlamak zorunda değilsiniz; istemediğiniz soruyu geçebilir ya da ses kaydının durdurulmasını isteyebilirsiniz. Gönüllüler, araştırmaya katılmayı kabul etmediklerinde ya da araştırma sırasında vazgeçmeleri durumunda herhangi bir olumsuz sonuçla karşılaşmayacaktır; bu karar, derslerinizdeki akademik değerlendirmenizi hiçbir şekilde olumsuz etkilemeyecektir.</p>
<p>Bu araştırmaya katılmanız için sizden herhangi bir ücret talep edilmeyecek ve katılımınız karşılığında size bir ödeme yapılmayacaktır. Çalışmadan elde edilecek bilgiler tamamen bilimsel araştırma amacı ile kullanılacaktır. Görüşme kayıtları yazıya dökülürken kimliğinizi ortaya çıkarabilecek bilgiler (adınız, öğretim elemanlarınızın ve arkadaşlarınızın adları vb.) çıkarılacak ve size yalnızca bir katılımcı kodu verilecektir. Ad-soyad bilginizin yer aldığı bu form, görüşme verilerinden ayrı tutularak gizli tutulacaktır. Verilere sadece araştırma ekibindeki araştırmacılar erişebilecektir.</p>
<h4>Araştırmaya Katılacak Kişiler için Olası Riskler</h4>
<p>Araştırma, düşük risk kategorisinde değerlendirilmektedir. Bu araştırmayla ilişkili bilinen fiziksel veya psikolojik bir risk bulunmamaktadır. Olası düşük düzeyli riskler; görüşme süresine bağlı hafif yorgunluk ile YZ kullanımı ve ödevlerle ilgili deneyimlerinizi anlatırken hafif bir rahatsızlık hissetme ile sınırlıdır.</p>
<p>Olası riskleri en aza indirmek adına görüşmeyi dersinizi vermeyen bir araştırmacı yapacak; anlattıklarınız hiçbir şekilde notlandırılmayacak ya da yargılanmayacak, dilediğiniz soruyu yanıtlamayabilecek veya görüşmeyi sonlandırabileceksiniz. Ses kayıtları şifrelenerek güvenli bir şekilde saklanacak ve yazıya dökülüp doğrulandıktan sonra silinecektir; kimlik bilgilerinden arındırılmış görüşme dökümleri araştırmanın tamamlanmasından sonra 3 (üç) yıl süreyle şifreli olarak saklanacaktır. Ses kayıtlarının yazıya dökülmesinde verilerin yurt dışına aktarılmasına yol açan bulut tabanlı hizmetler kullanılmayacaktır. Kişisel verileriniz Kişisel Verilerin Korunması Kanunu’na uygun olarak işlenecektir.</p>
<h4>Araştırmaya Dahil Olacak Toplam Gönüllü Sayısı</h4>
<p>Araştırmaya, Ankara Üniversitesi Yazılım Mühendisliği ve Hacettepe Üniversitesi Bilgisayar ve Öğretim Teknolojileri Eğitimi bölümlerinden 15’er öğrenci olmak üzere toplam 30 gönüllü dahil edilecektir.</p>
<p>Bu araştırmada yer almak tümüyle sizin isteğinize bağlıdır. Araştırmada yer almayı reddedebilirsiniz ya da başladıktan sonra yarıda bırakabilirsiniz. Bu araştırmanın sonuçları bilimsel amaçlarla kullanılacaktır. Araştırmadan çekilmeniz ya da araştırmacı tarafından araştırmadan çıkarılmanız halinde, ses kaydınız ve sizinle ilgili veriler silinecek ve kullanılmayacaktır. Ancak katılımcı kodu ile kimlik bilgileri arasındaki eşleştirme listesi veri analizi tamamlandığında imha edileceğinden, bu tarihten sonra belirli bir yanıtın size ait olduğunun tespit edilmesi mümkün olmayacak ve anonimleşmiş verilerin araştırmadan çıkarılması mümkün olmayabilir. Sizden elde edilen tüm bilgiler gizli tutulacak ve şifrelenerek saklanacaktır; araştırmada, yayınlarda ve sunumlarda kimliğiniz tamamen anonim kalacaktır. Araştırmayla ilgili sorularınız için Prof. Dr. Yasemin DEMİRASLAN ÇEVİK (yasemind@hacettepe.edu.tr) veya Dr. Öğr. Üyesi Rukiye SAVRAN KIZILTEPE (rukiyekiziltepe@ankara.edu.tr) ile iletişime geçebilirsiniz.</p>
<h4>Gönüllü Katılımcı Onayı</h4>
<p>Yukarıda yer alan ve araştırmaya başlamadan önce gönüllülere verilmesi gereken bilgileri içeren metni okudum (ya da sözlü olarak dinledim). Eksik kaldığını düşündüğüm konularda sorularımı araştırmacılara sordum ve yanıtlar aldım. Yazılı ve sözlü olarak tarafıma sunulan tüm açıklamaları ayrıntılarıyla anladığım kanısındayım. Çalışmaya katılmayı isteyip istemediğim konusunda karar vermem için yeterince zaman tanındı. 18 yaşını doldurmuş olduğumu beyan ederim.</p>
<p>Bu koşullar altında, araştırma kapsamında elde edilen şahsıma ait bilgilerin bilimsel amaçlarla kullanılmasını, gizlilik kurallarına uymak kaydıyla sunulmasını ve yayınlanmasını, hiçbir baskı ve zorlama altında kalmaksızın, kendi özgür irademle kabul ettiğimi beyan ederim.</p>
`;

/* ===== Sunucu ===== */
// Katılımcı kodu sunucudaki havuzdan alınır (harf-rakam-harf-rakam, ör. K7M3); her kod yalnızca bir kez verilir.
async function api(path, opts = {}){
  const r = await fetch(CFG.url + "/rest/v1/" + path, {
    method: opts.body ? "POST" : "GET",
    headers: { apikey: CFG.key, "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    keepalive: !!opts.keepalive,
  });
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) { const e = new Error((data && data.message) || r.statusText); e.code = data && data.message; throw e; }
  return data;
}
const rpc = (fn, args, opts = {}) => api("rpc/" + fn, { ...opts, body: args });
const fmtCode = c => c;
const NUM = ["", "bir", "iki", "üç", "dört", "beş", "altı", "yedi", "sekiz", "dokuz"];

async function loadContent(){
  const q = "?select=*&active=eq.true&order=sort_order.asc,id.asc";
  const [g, d, s, c] = await Promise.all(["groups", "departments", "survey_questions", "cards"].map(t => api(t + q)));
  GROUPS = g.map((x, i) => ({ id: x.id, label: x.label, desc: x.description, c: "--" + x.color, key: i < 9 ? String(i + 1) : "" }));
  DEPTS = d.map(x => ({ id: x.id, label: x.label }));
  SURVEY = s.map(x => ({ id: x.id, q: x.question, type: x.type, opts: x.options || [], hint: x.hint, other: x.other_label || "Diğer", required: x.required || x.type === "dept", follow: x.follow && x.follow.id ? x.follow : null }));
  CARDS = c.map(x => ({ id: x.id, text: x.text, level: x.level, dept: x.dept }));
}

/* ===== Durum ===== */
const LS = "egitimYZ:v3:";
let S = null, draft = null, declined = false, boot = "loading", resetNotice = false, starting = false;
let selected = null, justPlaced = null, deckEnter = false, lastFocus = null;
const openTrays = new Set();

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
const gById = id => GROUPS.find(g => g.id === id);
const dById = id => DEPTS.find(d => d.id === id);
const store = {
  get(k){ try { const v = localStorage.getItem(LS + k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k,v){ try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(LS + k); } catch {} },
};
// Gönderilmemiş değişikliği olan oturumlar "pending" listesinde tutulur; sayfa yeniden açılınca gönderilir.
function persist(s){
  store.set("s:" + s.participant_code, s);
  const pend = new Set(store.get("pending") || []);
  if (s.rev !== s.synced_rev || s.outbox.length) pend.add(s.participant_code); else pend.delete(s.participant_code);
  store.set("pending", [...pend]);
}
const save = () => { if (S) { S.rev++; persist(S); store.set("current", S.participant_code); queueSync(S); } };
const announce = msg => { const l = $("#live"); l.textContent = ""; setTimeout(() => l.textContent = msg, 30); };
const now = () => new Date().toISOString();
const elapsed = () => S && S.sort_started_at ? Date.now() - Date.parse(S.sort_started_at) : 0;
// Destedeki kartlar oturum başında kopyalanır; admin sonradan kartı değiştirse de oturum bozulmaz.
const card = id => (S && S.cards[id]) || (S && S.custom_cards.find(c => c.id === id)) || null;
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const u = new Uint32Array(1); crypto.getRandomValues(u); const j = u[0] % (i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ev(e){ e.at = now(); S.events.push(e); S.outbox.push(e); }

function newSession(code, token){
  return {
    schema: 4, participant_code: code, token, department: null, consent: true,
    stage: "survey", created_at: now(), survey: {}, survey_completed_at: null,
    sort_started_at: null, completed_at: null, withdrawn_at: null,
    deck_order: [], remaining: [], cards: {},
    placements: {}, placed_at: {}, changes: {},
    custom_cards: [], history: [], events: [], outbox: [], rev: 0, synced_rev: 0,
  };
}
function buildDeck(){
  const deck = CARDS.filter(c => c.dept === "all" || c.dept === S.department);
  S.cards = Object.fromEntries(deck.map(c => [c.id, { id: c.id, text: c.text, level: c.level }]));
  const ids = shuffle(deck.map(c => c.id));
  S.deck_order = ids.slice(); S.remaining = ids.slice();
}
const totalCards = () => S.deck_order.length + S.custom_cards.length;
const placedCount = () => Object.keys(S.placements).length;
const hasDeptQ = () => SURVEY.some(q => q.type === "dept");

/* ===== Sunucuya kayıt ===== */
const syncTimers = new Map(), syncBusy = new Set();
let syncFailed = false;
function queueSync(s, delay = 700){
  clearTimeout(syncTimers.get(s.participant_code));
  syncTimers.set(s.participant_code, setTimeout(() => syncNow(s), delay));
  if (s === S) setSync();
}
async function syncNow(s, keepalive = false){
  if (!s || !s.token) return;
  if (syncBusy.has(s.participant_code)) { queueSync(s, 800); return; }
  syncBusy.add(s.participant_code);
  const rev = s.rev, sent = s.outbox.slice();
  try {
    await rpc("sync_session", { p_code: s.participant_code, p_token: s.token, p_state: exportState(s), p_events: sent }, { keepalive });
    s.outbox.splice(0, sent.length); s.synced_rev = rev; syncFailed = false;
    persist(s);
    if (s.rev !== s.synced_rev || s.outbox.length) queueSync(s, 300);
  } catch (e) {
    if (e.code === "invalid_session") return invalidSession(s);
    syncFailed = true; queueSync(s, 5000);
  } finally { syncBusy.delete(s.participant_code); if (s === S) setSync(); }
}
// Araştırmacı kodu sıfırladıysa yerel oturum bırakılır
function invalidSession(s){
  store.del("s:" + s.participant_code);
  const pend = (store.get("pending") || []).filter(c => c !== s.participant_code); store.set("pending", pend);
  if (S === s) { store.del("current"); S = null; selected = null; openTrays.clear(); resetNotice = true; render(); }
}
function setSync(){
  const el = $("#syncStat"); if (!el || !S) return;
  const dirty = S.rev !== S.synced_rev || S.outbox.length;
  el.classList.toggle("error", syncFailed && !!dirty);
  el.textContent = !dirty ? (S.completed_at ? "Yanıtlarınız kaydedildi." : "") : syncFailed ? "Bağlantı yok. Yanıtlar bu cihazda tutuluyor, bağlantı gelince gönderilecek." : "Kaydediliyor…";
}
window.addEventListener("pagehide", () => {
  (store.get("pending") || []).forEach(code => { const s = code === (S && S.participant_code) ? S : store.get("s:" + code); if (s) syncNow(s, true); });
});

async function claimDraft(){
  draft = store.get("draft");
  if (draft) return;
  try {
    draft = await rpc("claim_code", { p_user_agent: navigator.userAgent });
    store.set("draft", draft);
  } catch { draft = { error: true }; }
  if (!S) render();
}

/* ===== Kart eylemleri ===== */
function place(id, to){
  const c = card(id); if (!c || !gById(to)) return;
  const from = S.placements[id] ?? null;
  if (from === to) { selected = null; render(); return; }
  if (from === null) { S.remaining = S.remaining.filter(x => x !== id); deckEnter = true; }
  else S.changes[id] = (S.changes[id] || 0) + 1;
  S.placements[id] = to; S.placed_at[id] = Date.now();
  S.history.push({ id, from, to });
  ev({ t: elapsed(), type: from === null ? "place" : "move", card: id, from, to });
  justPlaced = id; selected = null;
  save(); render();
  announce(`“${c.text}” kartı “${gById(to).label}” grubuna ${from === null ? "kondu" : "taşındı"}.`);
}
function undo(){
  const h = S.history.pop(); if (!h) return;
  if (!card(h.id)) return undo();
  if (h.from === null) { delete S.placements[h.id]; delete S.placed_at[h.id]; S.remaining.unshift(h.id); deckEnter = true; }
  else { S.placements[h.id] = h.from; S.changes[h.id] = Math.max(0, (S.changes[h.id] || 1) - 1); }
  ev({ t: elapsed(), type: "undo", card: h.id, from: h.to, to: h.from });
  selected = null; save(); render();
  announce(h.from === null ? "Son kart desteye geri kondu." : "Son taşıma geri alındı.");
}
function addBlank(text){
  const id = "C" + (S.custom_cards.length + 1) + "-" + Date.now().toString(36).slice(-4);
  S.custom_cards.push({ id, text, level: "Katılımcı kartı", dept: "custom", custom: true });
  S.remaining.unshift(id);
  ev({ t: elapsed(), type: "add_blank", card: id, text });
  deckEnter = true; selected = null; save(); render();
  announce("Kartınız destenin en üstüne eklendi.");
}
function removeBlank(id){
  S.custom_cards = S.custom_cards.filter(c => c.id !== id);
  S.remaining = S.remaining.filter(x => x !== id);
  ev({ t: elapsed(), type: "remove_blank", card: id });
  save(); render(); announce("Kart silindi.");
}
function exportState(s){
  const all = [...s.deck_order.map(id => s.cards[id]).filter(Boolean), ...s.custom_cards];
  return {
    department: s.department,
    stage: s.stage,
    survey: s.survey,
    survey_completed_at: s.survey_completed_at,
    sort_started_at: s.sort_started_at,
    completed_at: s.completed_at,
    withdrawn_at: s.withdrawn_at,
    deck_order: s.deck_order,
    placements: s.placements,
    changes: s.changes,
    custom_cards: s.custom_cards,
    sorts: all.map(c => ({ card_id: c.id, card_text: c.text, card_level: c.level, is_custom: !!c.custom, group: s.placements[c.id] || null, group_label: (gById(s.placements[c.id]) || {}).label || null, changes: s.changes[c.id] || 0 })),
  };
}

/* ===== Görünümler ===== */
function render(){
  const app = $("#app");
  if (boot !== "ready") app.innerHTML = viewLoading();
  else if (!S) app.innerHTML = declined ? viewDecline() : viewWelcome();
  else if (S.completed_at) app.innerHTML = viewDone();
  else if (S.stage === "survey") app.innerHTML = viewSurvey();
  else if (S.stage === "intro") app.innerHTML = viewIntro();
  else app.innerHTML = viewSort();
  if (lastFocus) { const el = document.querySelector(lastFocus); if (el) el.focus({ preventScroll: true }); lastFocus = null; }
  justPlaced = null; deckEnter = false;
  setSync();
}

function viewLoading(){
  return boot === "error"
    ? `<main class="loading"><div><p>Sunucuya bağlanılamadı. İnternet bağlantınızı kontrol edip yeniden deneyin.</p><button class="btn btn-primary" id="btnRetry" type="button">Yeniden dene</button></div></main>`
    : `<main class="loading"><p>Yükleniyor…</p></main>`;
}

function topBar(step, extra = ""){
  const d = dById(S.department);
  return `<header class="top"><div class="top-in">
    <div class="who"><span>Katılımcı kodu</span><span class="codechip">${fmtCode(S.participant_code)}</span><span id="whoDept">${esc(d ? d.label : "")}</span></div>
    ${step ? `<span class="stepnow">${step}</span>` : ""}
    ${extra}
  </div></header>`;
}

function viewWelcome(){

        <li><b>2</b><span>Kart sıralama<span class="dur">, yaklaşık</span> 5 dk</span></li>
      </ol>
      <section class="consent-box" tabindex="0" aria-label="Bilgilendirme metni: Aydınlatılmış Onam Formu">${CONSENT_HTML}</section>
      <p class="contact">Sorularınız için: Prof. Dr. Yasemin Demiraslan Çevik (yasemind@hacettepe.edu.tr) veya Dr. Öğr. Üyesi Rukiye Savran Kızıltepe (rukiyekiziltepe@ankara.edu.tr)</p>

      </div>

      <fieldset class="field">

function viewDecline(){
  return `<main class="decline">
    <h1>Teşekkür ederiz</h1>
    <p class="lede">Araştırmaya katılmamayı seçtiniz. Hiçbir yanıtınız kaydedilmedi. Bu ekranı araştırmacıya gösterebilirsiniz.</p>
    <button class="btn btn-quiet" id="btnBack" type="button">Başa dön</button>
  </main>`;
}

function pillsHtml(q, val){
  if (q.type === "dept") {
    return `<div class="pills">${DEPTS.map(d => `<label class="pill"><input type="radio" name="department" value="${d.id}" ${S.department === d.id ? "checked" : ""}><span>${esc(d.label)}</span></label>`).join("")}</div>
      <div class="err" id="deptErr"></div>`;
  }
  if (q.type === "text") {
    return `<label class="sr" for="q_${q.id}">${esc(q.q)}</label><input class="txtin" id="q_${q.id}" data-text="${q.id}" maxlength="300" value="${esc(val)}">`;
  }
  if (q.type === "multi") {
    const arr = (val && val.selected) || [];
    return `<div class="pills">${q.opts.map(o => `<label class="pill"><input type="checkbox" name="${q.id}" value="${esc(o)}" ${arr.includes(o) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>
      <label class="sr" for="${q.id}_other">${esc(q.other)}</label>
      <input class="txtin" id="${q.id}_other" data-other="${q.id}" maxlength="120" placeholder="${esc(q.other)} (isteğe bağlı)" value="${esc(val && val.other)}">`;
  }
  return `<div class="pills">${q.opts.map(o => `<label class="pill"><input type="radio" name="${q.id}" value="${esc(o)}" ${val === o ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>
    ${q.follow ? `<div class="follow ${val === q.follow.when ? "show" : ""}" data-follow="${q.id}"><label for="${q.follow.id}">${esc(q.follow.q)}</label><input class="txtin" id="${q.follow.id}" data-text="${q.follow.id}" maxlength="160" value="${esc(S.survey[q.follow.id])}"></div>` : ""}
    <button type="button" class="link qclear" data-clear="${q.id}">Yanıtı temizle</button>`;
}

function viewSurvey(){
  return `${topBar("Adım 1 / 2: Bilgi formu")}
  <main class="survey">
    <h1>Bilgi formu</h1>
    <p class="lede">Bu sorular görüşme süresinden tasarruf etmek ve katılımcıların genel özelliklerini betimlemek için soruluyor. ${SURVEY.every(q => !q.required || q.type === "dept") ? "Bölüm sorusu dışındaki" : "Zorunlu olanlar dışındaki"} soruları yanıtlamak istemezseniz boş bırakabilirsiniz.</p>
    <form id="surveyForm" novalidate>
      ${SURVEY.map((q, i) => `
      <fieldset class="q">
        <legend><span class="n">${i + 1}.</span>${esc(q.q)}</legend>
        ${q.hint ? `<p class="hint">${esc(q.hint)}</p>` : ""}
        ${pillsHtml(q, q.type === "dept" ? S.department : S.survey[q.id])}

    <div class="foot"><span class="sync" id="syncStat"></span><button class="link" id="btnWithdraw" type="button">Oturumu sonlandır</button></div>
  </main>`;
}

function viewIntro(){
  const n = S.deck_order.length;
  return `${topBar("Adım 2 / 2: Kart sıralama")}
  <main class="intro">
    <h1>Kart sıralama etkinliği</h1>
    <p class="lede">Şimdi ${n} kart göreceksiniz. Her kartta öğrenirken ya da ödev yaparken yapılan bir iş yazıyor. Bu işi genellikle nasıl yaptığınızı düşünün ve kartı aşağıdaki ${NUM[GROUPS.length] || GROUPS.length} gruptan birine koyun.</p>
    <div class="ladder" role="list" style="--n:${Math.min(GROUPS.length, 4)}">
      ${GROUPS.map(g => `<div class="rung" role="listitem" style="--c:var(${g.c});--bg:var(${g.c}-bg)"><b>${esc(g.label)}</b><span>${esc(g.desc)}</span></div>`).join("")}
    </div>

    <button class="btn btn-primary" id="btnSortStart" type="button">Kartlara başla</button>
    <div class="foot"><span class="sync" id="syncStat"></span><button class="link" id="btnWithdraw" type="button">Oturumu sonlandır</button></div>

function viewSort(){
  const total = totalCards(), placed = placedCount();
  const pct = total ? Math.round(placed / total * 100) : 0;
  const top = S.remaining[0] ? card(S.remaining[0]) : null;
  const blankLeft = MAX_BLANK - S.custom_cards.length;
  const sel = selected ? card(selected) : null;

  const deckHtml = top ? `
    <div class="deck">
      ${S.remaining.length > 2 ? `<div class="stack s2"></div>` : ""}
      ${S.remaining.length > 1 ? `<div class="stack s1"></div>` : ""}
      <div class="icard top-card ${top.custom ? "custom" : ""} ${sel ? "dim" : ""} ${deckEnter ? "enter" : ""}" data-card="${top.id}" data-source="deck" tabindex="0"
           aria-label="Sıradaki kart: ${esc(top.text)}. Bir gruba koymak için 1–${Math.min(GROUPS.length, 9)} tuşlarını kullanın ya da gruba dokunun.">
        <div class="meta"><span>${top.custom ? "Sizin kartınız" : "Sıradaki kart"}</span>
          <span>${top.custom ? `<button class="del" data-del="${top.id}" type="button">Kartı sil</button>` : `${S.remaining.length} kart kaldı`}</span></div>
        <div class="txt">${esc(top.text)}</div>
      </div>
    </div>` : `
    <div class="done-panel">
      <h2>Bütün kartları yerleştirdiniz</h2>
      <p>${blankLeft ? `Listede olmayan ama yapay zekâ kullandığınız bir iş varsa boş karta yazabilirsiniz. ${blankLeft} boş kart kaldı.` : "Üç boş kartın hepsini kullandınız."}</p>
      <p>Bir kartı başka gruba taşımak isterseniz karta dokunun.</p>
      <div class="acts">
        ${blankLeft ? `<button class="btn btn-quiet" id="btnBlank" type="button">Boş karta yaz</button>` : ""}
        <button class="btn btn-primary" id="btnFinish" type="button">Sıralamayı bitir</button>
      </div>
    </div>`;

  const selNote = sel ? `<div class="selnote" role="status"><span>“${esc(sel.text)}” seçildi. Taşımak için bir gruba dokunun.</span><button class="link" id="btnDesel" type="button">Vazgeç</button></div>` : "";
  const extra = `<div class="prog" aria-label="İlerleme"><div class="bar"><i style="width:${pct}%"></i></div><span>${placed} / ${total} kart</span></div>
    <button class="btn btn-quiet" id="btnUndo" type="button" ${S.history.length ? "" : "disabled"}>Geri al</button>`;

  return `${topBar("", extra)}
  <main class="wrap">
    <section class="stage">
      <div class="howto">
        <p>Bu işi genellikle nasıl yaptığınızı düşünün ve kartı uygun gruba koyun.</p>
        <p>Kartı sürükleyebilir ya da bir gruba dokunabilirsiniz. Yerleştirdiğiniz kartı sonradan başka gruba taşıyabilirsiniz.</p>
        <p class="kbdhint">Klavye: <kbd>1</kbd>–<kbd>${Math.min(GROUPS.length, 9)}</kbd> kartı gruba koyar.</p>
      </div>
      <div class="deck-col">${deckHtml}${selNote}</div>
    </section>
    <section class="trays" aria-label="Gruplar" style="--n:${Math.min(GROUPS.length, 4)}">${GROUPS.map(g => trayHtml(g)).join("")}</section>
    <div class="foot"><span class="sync" id="syncStat"></span><button class="link" id="btnWithdraw" type="button">Oturumu sonlandır</button></div>
  </main>`;
}

function trayHtml(g, readonly = false){
  const ids = Object.keys(S.placements).filter(id => S.placements[id] === g.id)
    .sort((a, b) => (S.placed_at[b] || 0) - (S.placed_at[a] || 0));
  const target = selected ? card(selected) : card(S.remaining[0]);
  const armed = !readonly && target && S.placements[target.id] !== g.id;
  const hint = selected ? "Buraya taşı" : "Buraya koy";
  const minis = ids.length
    ? ids.map(id => { const c = card(id); return `<button type="button" class="mini ${c.custom ? "custom" : ""} ${justPlaced === id ? "just" : ""}" data-card="${id}" data-source="tray" ${readonly ? "disabled" : `aria-pressed="${selected === id}"`}>${esc(c.text)}</button>`; }).join("")
    : `<div class="tray-empty">${readonly ? "Bu grupta kart yok." : "Henüz kart yok."}</div>`;
  const open = openTrays.has(g.id) || (selected && S.placements[selected] === g.id);
  const toggle = !readonly && ids.length
    ? `<button type="button" class="tray-toggle" data-toggle="${g.id}" aria-expanded="${!!open}">${open ? "Kartları gizle" : `Kartları göster (${ids.length})`}</button>` : "";
  return `
  <div class="tray ${armed ? "armed" : ""} ${open ? "open" : ""}" data-tray="${g.id}" style="--c:var(${g.c});--bg:var(${g.c}-bg)">
    <button type="button" class="tray-head" data-target="${readonly ? "" : g.id}" ${readonly || !armed ? 'tabindex="-1"' : ""} aria-label="${esc(g.label)}: ${esc(g.desc)} ${ids.length} kart.${armed ? " " + hint : ""}">
      <span class="name">${esc(g.label)}${readonly || !g.key ? "" : `<kbd>${g.key}</kbd>`}</span>
      <span class="count" aria-hidden="true">${ids.length}</span>
      <span class="desc">${esc(g.desc)}</span>
    </button>
    <div class="tray-body" data-target="${readonly ? "" : g.id}">${minis}</div>
    ${toggle}
  </div>`;
}

function viewDone(){
  return `
  <main class="done">
    <h1>Teşekkürler, sıralamanız tamamlandı</h1>
    <p class="lede">Katılımcı kodu ${fmtCode(S.participant_code)}, ${placedCount()} kart. Görüşmenin devamında bu gruplar üzerinden konuşacağız; ekran açık kalabilir.</p>
    <section class="trays" aria-label="Son sıralama" style="--n:${Math.min(GROUPS.length, 4)}">${GROUPS.map(g => trayHtml(g, true)).join("")}</section>
    <div class="foot" style="margin-top:26px"><span class="sync" id="syncStat"></span><button class="btn btn-primary" id="btnNew" type="button">Yeni katılımcı başlat</button></div>
  </main>`;
}

/* ===== Onay penceresi ===== */
let cfAction = null;
function confirmBox(title, text, okLabel, cancelLabel, action){
  $("#cfTitle").textContent = title; $("#cfText").textContent = text;
  $("#cfOk").textContent = okLabel; $("#cfCancel").textContent = cancelLabel;
  cfAction = action; $("#dlgConfirm").showModal();
}

/* ===== Olaylar ===== */
document.addEventListener("submit", e => {
  const f = e.target;
  if (f.id === "startForm") {
    e.preventDefault();
    const consent = (f.querySelector('input[name="consent"]:checked') || {}).value;
    $("#consentErr").textContent = "";
    if (!consent) { $("#consentErr").textContent = "Lütfen katılıp katılmadığınızı işaretleyin."; f.querySelector('input[name="consent"]').focus(); return; }
    const d = draft;
    if (!d || d.error) return;
    if (consent === "no") {
      rpc("release_code", { p_code: d.code, p_token: d.token }).catch(() => {});
      declined = true; draft = null; store.del("draft"); render(); return;
    }
    starting = true; render();
    rpc("start_session", { p_code: d.code, p_token: d.token }).then(() => {
      starting = false; draft = null; store.del("draft"); resetNotice = false;
      S = newSession(d.code, d.token);
      save(); render(); window.scrollTo(0, 0);
    }).catch(err => {
      starting = false;
      // Kodun süresi dolduysa yeni kod alınır
      if (err.code === "invalid_session") { draft = null; store.del("draft"); render(); $("#consentErr").textContent = "Kodunuzun süresi dolmuştu, yeni bir kod verildi. Lütfen yeniden Başla’ya basın."; }
      else { render(); $("#consentErr").textContent = "Sunucuya bağlanılamadı. Bağlantınızı kontrol edip yeniden deneyin."; }
    });
  }
  if (f.id === "surveyForm") {
    e.preventDefault();
    if (hasDeptQ() && !S.department) { $("#deptErr").textContent = "Kartlar bölümünüze göre hazırlandığı için bu soruyu yanıtlamanız gerekiyor."; f.querySelector('input[name="department"]').focus(); return; }
    const missing = SURVEY.filter(q => q.required && q.type !== "dept" && !answered(q));
    f.querySelectorAll("[data-err]").forEach(el => el.textContent = "");
    if (missing.length) {
      missing.forEach(q => { f.querySelector(`[data-err="${q.id}"]`).textContent = "Bu soruyu yanıtlamanız gerekiyor."; });
      const el = f.querySelector(`[name="${missing[0].id}"], [data-text="${missing[0].id}"]`); if (el) el.focus();
      return;
    }
    buildDeck();
    S.survey_completed_at = now(); S.stage = "intro";
    ev({ type: "survey_complete", answered: SURVEY.filter(answered).length, total: SURVEY.length });
    save(); render(); window.scrollTo(0, 0);
  }
  if (f.id === "blankForm") {
    e.preventDefault();
    const t = $("#blankText").value.trim().replace(/\s+/g, " ");
    if (t.length < 3) { $("#blankErr").textContent = "Kartın metnini yazın."; return; }
    $("#dlgBlank").close(); lastFocus = ".top-card"; addBlank(t);
  }
});

function answered(q){
  if (q.type === "dept") return !!S.department;
  const v = S.survey[q.id];
  if (q.type === "multi") return !!v && ((v.selected || []).length > 0 || !!(v.other || "").trim());
  return typeof v === "string" && v.trim() !== "";
}

// Bilgi formu yanıtları her değişiklikte kaydedilir
document.addEventListener("change", e => {
  if (!S || S.stage !== "survey") return;
  const el = e.target;
  const q = SURVEY.find(q => q.id === el.name);
  if (!q) return;
  if (q.type === "dept") {
    S.department = el.value; const w = $("#whoDept"); if (w) w.textContent = dById(el.value).label;
    $("#deptErr").textContent = ""; save(); return;
  }
  if (q.type === "multi") {
    const cur = S.survey[q.id] || { selected: [], other: "" };
    cur.selected = [...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(i => i.value);
    S.survey[q.id] = cur;
  } else S.survey[q.id] = el.value;
  if (q.follow) { const fw = $(`[data-follow="${q.id}"]`); if (fw) fw.classList.toggle("show", el.value === q.follow.when); }
  const er = $(`[data-err="${q.id}"]`); if (er) er.textContent = "";
  save();
});
document.addEventListener("input", e => {
  if (!S || S.stage !== "survey") return;
  const el = e.target;
  if (el.dataset.other) { const cur = S.survey[el.dataset.other] || { selected: [], other: "" }; cur.other = el.value; S.survey[el.dataset.other] = cur; save(); }
  if (el.dataset.text) { S.survey[el.dataset.text] = el.value; save(); }
});

let suppressClick = false;
document.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; return; }
  const t = e.target;
  if (t.closest("#cfCancel")) { $("#dlgConfirm").close(); cfAction = null; return; }
  if (t.closest("#cfOk")) { $("#dlgConfirm").close(); const a = cfAction; cfAction = null; if (a) a(); return; }
  if (t.closest("#btnBack")) { declined = false; render(); return; }
  if (t.closest("#btnRetry")) { start(); return; }
  if (t.closest("#btnNew")) { if (S) syncNow(S); store.del("current"); openTrays.clear(); S = null; selected = null; render(); window.scrollTo(0, 0); return; }
  if (!S) return;
  const clr = t.closest("[data-clear]");
  if (clr) {
    const id = clr.dataset.clear;
    document.querySelectorAll(`input[name="${id}"]`).forEach(i => i.checked = false);
    delete S.survey[id];
    const q = SURVEY.find(q => q.id === id); if (q && q.follow) { delete S.survey[q.follow.id]; const fw = $(`[data-follow="${id}"]`); if (fw) fw.classList.remove("show"); }
    save(); return;
  }
  if (t.closest("#btnWithdraw")) {
    confirmBox("Oturumu sonlandırmak istiyor musunuz?", "Katılımcı çalışmadan çekilirse ya da oturum yanlışlıkla başlatıldıysa kullanın. Oturum “sonlandırıldı” olarak işaretlenir ve giriş ekranına dönülür.", "Oturumu sonlandır", "Vazgeç", () => {
      S.withdrawn_at = now(); ev({ type: "withdraw", stage: S.stage }); save(); syncNow(S); store.del("current"); S = null; selected = null; openTrays.clear(); render(); window.scrollTo(0, 0);
    });
    return;
  }
  if (t.closest("#btnSortStart")) { S.stage = "sort"; S.sort_started_at = now(); ev({ t: 0, type: "sort_start" }); save(); deckEnter = true; lastFocus = ".top-card"; render(); window.scrollTo(0, 0); return; }
  if (S.completed_at || S.stage !== "sort") return;
  if (t.closest("#btnUndo")) { undo(); return; }
  if (t.closest("#btnDesel")) { selected = null; render(); return; }
  if (t.closest("#btnBlank")) { $("#blankText").value = ""; $("#blankErr").textContent = ""; $("#blankLeft").textContent = `${MAX_BLANK - S.custom_cards.length} / ${MAX_BLANK}`; $("#dlgBlank").showModal(); $("#blankText").focus(); return; }
  if (t.closest("#blankCancel")) { $("#dlgBlank").close(); return; }
  if (t.closest("#btnFinish")) {
    confirmBox("Sıralamayı bitirmek istiyor musunuz?", "Bitirdikten sonra kartları taşıyamazsınız. Emin değilseniz gruplara bir kez daha göz atabilirsiniz.", "Sıralamayı bitir", "Gruplara dön", () => {
      S.completed_at = now(); ev({ t: elapsed(), type: "complete" }); save(); render(); window.scrollTo(0, 0);
    });
    return;
  }
  const tg = t.closest("[data-toggle]");
  if (tg) { const id = tg.dataset.toggle; openTrays.has(id) ? openTrays.delete(id) : openTrays.add(id); lastFocus = `[data-toggle="${id}"]`; render(); return; }
  const del = t.closest("[data-del]"); if (del) { removeBlank(del.dataset.del); return; }
  const mini = t.closest(".mini[data-card]");
  if (mini) { selected = selected === mini.dataset.card ? null : mini.dataset.card; lastFocus = `.mini[data-card="${selected || mini.dataset.card}"]`; render(); return; }
  if (t.closest(".top-card") && selected) { selected = null; render(); return; }
  const tgt = t.closest("[data-target]");
  if (tgt && tgt.dataset.target) {
    const id = selected || S.remaining[0];
    if (id) { lastFocus = selected ? null : ".top-card"; place(id, tgt.dataset.target); }
  }
});

document.addEventListener("keydown", e => {
  if (!S || S.completed_at || S.stage !== "sort" || document.querySelector("dialog[open]")) return;
  if (e.target.matches("input,textarea")) return;
  const g = GROUPS.find(g => g.key === e.key);
  if (g) { const id = selected || S.remaining[0]; if (id) { e.preventDefault(); lastFocus = selected ? `.mini[data-card="${id}"]` : ".top-card"; place(id, g.id); } }
  else if (e.key === "Escape" && selected) { selected = null; render(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); undo(); }
});

/* Sürükle-bırak (fare, kalem; dokunmatikte yalnızca destedeki kart) */
let drag = null;
document.addEventListener("pointerdown", e => {
  if (!S || S.completed_at || S.stage !== "sort" || e.button !== 0) return;
  const el = e.target.closest("[data-card]");
  if (!el || e.target.closest("[data-del]")) return;
  const fromDeck = el.dataset.source === "deck";
  if (!fromDeck && e.pointerType === "touch") return;
  drag = { id: el.dataset.card, el, x0: e.clientX, y0: e.clientY, pid: e.pointerId, started: false, over: null };
});
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.started) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7) return;
    const r = drag.el.getBoundingClientRect();
    drag.ox = drag.x0 - r.left; drag.oy = drag.y0 - r.top;
    const gh = drag.el.cloneNode(true);
    gh.classList.add("ghost"); gh.classList.remove("enter", "just");
    gh.style.width = r.width + "px"; gh.removeAttribute("tabindex");
    document.body.appendChild(gh);
    drag.ghost = gh; drag.started = true;
    drag.el.classList.add("dragging-src"); if (drag.el.classList.contains("top-card")) drag.el.style.opacity = ".25";
    document.body.classList.add("is-dragging");
  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${e.clientX - drag.ox}px, ${e.clientY - drag.oy}px) rotate(-2deg)`;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const tray = under && under.closest("[data-tray]");
  const over = tray ? tray.dataset.tray : null;
  if (over !== drag.over) {
    document.querySelectorAll(".tray.over").forEach(t => t.classList.remove("over"));
    if (tray) tray.classList.add("over");
    drag.over = over;
  }
}, { passive: false });
function endDrag(e, cancel){
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  if (!d.started) return;
  suppressClick = true; setTimeout(() => suppressClick = false, 0);
  d.ghost.remove(); document.body.classList.remove("is-dragging");
  d.el.classList.remove("dragging-src"); d.el.style.opacity = "";
  document.querySelectorAll(".tray.over").forEach(t => t.classList.remove("over"));
  if (!cancel && d.over) place(d.id, d.over);
}
window.addEventListener("pointerup", e => endDrag(e, false));
window.addEventListener("pointercancel", e => endDrag(e, true));

/* Açılış: içerik yüklenir, gönderilmemiş kayıtlar gönderilir, yarım kalmış oturum varsa sürdürülür */
async function start(){
  boot = "loading"; render();
  try { await loadContent(); } catch { boot = "error"; render(); return; }
  boot = "ready";
  const cur = store.get("current");
  const pending = cur ? store.get("s:" + cur) : null;
  if (pending && pending.token && !pending.completed_at && !pending.withdrawn_at) {
    S = pending; ev({ type: "resume", stage: S.stage }); save();
  }
  (store.get("pending") || []).forEach(code => { if (!S || code !== S.participant_code) { const s = store.get("s:" + code); if (s && s.token) syncNow(s); } });
  render();
}
start();
})();
</script>
